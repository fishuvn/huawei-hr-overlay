name: Release

on:
  push:
    tags:
      - "v*.*.*"   # Only triggers on version tags: v1.0.0, v1.2.3, etc.
                   # Push a tag to trigger: git tag v1.0.0 && git push origin v1.0.0

  # Allow manual run from GitHub Actions UI (for testing)
  # When run manually, it builds but skips the GitHub Release step (no tag)
  workflow_dispatch:

permissions:
  contents: write   # Required to create GitHub Releases and upload assets

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup .NET 8 SDK ────────────────────────────────────
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ── 3. Publish self-contained single-file EXE (bundles .NET 8 runtime) ──
      - name: Publish Self-contained EXE
        shell: pwsh
        run: |
          if (Test-Path "./publish") { Remove-Item -Recurse -Force ./publish }

          dotnet publish HuaweiHROverlay/HuaweiHROverlay.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ./publish

          Write-Host "--- Publish output ---"
          Get-ChildItem ./publish | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      # ── 4. Publish runtime-dependent single-file EXE (needs .NET 8 Desktop Runtime) ──
      - name: Publish Runtime-dependent EXE
        shell: pwsh
        run: |
          if (Test-Path "./publish-lite") { Remove-Item -Recurse -Force ./publish-lite }

          dotnet publish HuaweiHROverlay/HuaweiHROverlay.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ./publish-lite

          Write-Host "--- Publish-lite output ---"
          Get-ChildItem ./publish-lite | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      # ── 5. Rename EXEs with version ───────────────────────────
      - name: Rename EXEs with version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -eq "") { $tag = "dev" }

          # Resolve absolute paths — avoids Rename-Item path/device name errors
          $fullSrc = (Resolve-Path "publish/HuaweiHROverlay.exe").Path
          $liteSrc = (Resolve-Path "publish-lite/HuaweiHROverlay.exe").Path
          $fullDst = Join-Path (Split-Path $fullSrc) "HuaweiHROverlay-$tag-win-x64.exe"
          $liteDst = Join-Path (Split-Path $liteSrc) "HuaweiHROverlay-$tag-win-x64-lite.exe"

          if (-not (Test-Path $fullSrc)) { Write-Error "EXE not found: $fullSrc"; exit 1 }
          if (-not (Test-Path $liteSrc)) { Write-Error "EXE not found: $liteSrc"; exit 1 }

          # Use Move-Item (more reliable than Rename-Item on Windows runners)
          Move-Item -Path $fullSrc -Destination $fullDst -Force
          Move-Item -Path $liteSrc -Destination $liteDst -Force
          Write-Host "OK: $(Split-Path $fullDst -Leaf)  ($([math]::Round((Get-Item $fullDst).Length/1MB,1)) MB)"
          Write-Host "OK: $(Split-Path $liteDst -Leaf)  ($([math]::Round((Get-Item $liteDst).Length/1MB,1)) MB)"

          # Expose the filenames to later steps via GITHUB_ENV
          "RELEASE_FILE=$fullDst" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_NAME=HuaweiHROverlay-$tag-win-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LITE_FILE=$liteDst" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LITE_NAME=HuaweiHROverlay-$tag-win-x64-lite.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── 6. Create GitHub Release (only on real version tags) ──
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Huawei HR Overlay ${{ github.ref_name }}"
          body: |
            ## What's New in ${{ github.ref_name }}

            *(full changelog below)*

            ### ✅ Two downloads — pick one

            | File | Size | For |
            |------|------|-----|
            | `HuaweiHROverlay-${{ github.ref_name }}-win-x64.exe` | ~180 MB | **Most users** — .NET 8 Desktop Runtime included, just download and run |
            | `HuaweiHROverlay-${{ github.ref_name }}-win-x64-lite.exe` | ~25 MB | Machines that already have the .NET 8 Desktop Runtime |

            ### 🚀 Quick Start
            1. Enable **HR Data Broadcasts** on your Huawei watch: `Settings → HR Data Broadcasts → ON`
            2. Run the EXE
            3. Click **▶ Scan**, select your watch, click **⚡ Connect** — repeat for more watches
            4. In OBS: **+ → Browser Source** → URL: `http://localhost:8764/` (or `http://localhost:8764/overlay/<DEVICE-ID>` per watch) → 400 × 120 px

            **Requires a Bluetooth 5.0+ adapter** (built into most modern PCs/dongles).

            ### 📋 Changelog

            **v1.1.0**
            - **Multi-device support** — connect multiple watches/bands at the same time, each with its own overlay
            - **Per-device overlay URLs** — `http://localhost:8764/overlay/<DEVICE-ID>` for one browser source per watch
            - **Self-contained release build** — full EXE now bundles the .NET 8 Desktop Runtime (no install needed)
            - **Lite build** — small EXE for machines that already have the runtime
            - Fixed: app shutdown could hang when OBS sources were still connected
            - Fixed: malformed BLE heart rate packets could crash the app
            - Fixed: Scan button stuck disabled after unexpected Bluetooth stop
            - Fixed: port conflict on startup no longer kills the app

            **v1.0.0**
            - Initial release: single-watch BLE heart rate overlay for OBS

            ---
            *Full setup guide: [README](https://github.com/${{ github.repository }}/blob/main/README.md)*
          files: |
            ${{ env.RELEASE_FILE }}
            ${{ env.LITE_FILE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
